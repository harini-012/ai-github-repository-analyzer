<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Repository Analysis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/dashboard.html"
            class="navbar-brand"
        >
            ← Dashboard
        </a>


        <button
            class="btn btn-outline-light"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">


    <!-- Repository information -->

    <div id="repositoryInfo"></div>


    <!-- File structure -->

    <div class="card mt-4">

        <div class="card-body p-4">

            <h4>
                📁 Project Structure
            </h4>

            <p class="text-muted">
                Files retrieved from the GitHub repository.
            </p>

            <pre
                id="fileTree"
                class="file-tree"
            ></pre>

        </div>

    </div>


    <!-- AI Analysis -->

    <div id="analysis" class="mt-4"></div>


</div>


<script src="js/repository.js"></script>

</body>
</html>
